<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Авторизация</title>
  <meta name="description" content="Страница входа в систему. Введите email и пароль для авторизации." />
  <link rel="stylesheet" href="css/aut.css" />
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="particles" id="particles-container"></div>

  <div class="card-wrapper">
    <div class="card">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
      </div>

      <!-- Heading -->
      <div class="heading">
        <h1>Добро пожаловать</h1>
        <p>Введите данные для входа в аккаунт</p>
      </div>

      <!-- Error box -->
      <div class="error-box" id="error-box" role="alert" aria-live="polite">
        <span class="error-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
        </span>
        <span class="error-text" id="error-text"></span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="email" class="form-label">Электронная почта</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="text"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              inputmode="email"
            />
          </div>
          <span class="field-error" id="email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Показать пароль">
              <svg id="eye-open" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg id="eye-closed" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.11 17 4 12 4c-1.27 0-2.49.2-3.64.57l2.17 2.17C11.21 6.62 11.6 6.5 12 6.5v.5zm-9.9-1.47 2.17 2.17C2.91 8.92 1.83 10.33 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2.1 4.17l.89.89-.89-.53zM12 17c-2.76 0-5-2.24-5-5 0-.77.18-1.5.49-2.14l1.57 1.57c-.03.18-.06.37-.06.57 0 1.66 1.34 3 3 3 .2 0 .38-.03.57-.07L14.14 16.5C13.5 16.82 12.77 17 12 17zm2.97-5.33c-.15-1.4-1.25-2.49-2.64-2.64l2.64 2.64z"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" role="alert"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-content">
            <span class="spinner" id="spinner"></span>
            <span class="btn-label" id="btn-label">Войти</span>
          </span>
        </button>

      </form>

      <p class="footer-note">Введите данные вашего аккаунта для доступа</p>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/aut.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная — Личный кабинет</title>
  <meta name="description" content="Личный кабинет авторизованного пользователя." />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="particles" id="particles-container"></div>

  <div class="page" id="page-content" style="display:none">

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="Основная навигация">
      <div class="nav-logo">
        <div class="nav-logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <span class="nav-brand">Личный кабинет</span>
      </div>
      <div class="status-badge" aria-label="Статус: онлайн">
        <span class="status-dot"></span>
        <span>Онлайн</span>
      </div>
    </nav>

    <!-- Main content -->
    <main class="content" role="main">
      <div class="content-inner">

        <!-- Welcome card -->
        <div class="welcome-card">
          <div class="welcome-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>

          <h1 class="welcome-title">Добро пожаловать!</h1>
          <p class="welcome-subtitle">Вы успешно вошли в систему. Рады видеть вас снова.</p>

          <div class="email-pill" aria-label="Статус пользователя">
            <svg viewBox="0 0 24 24">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            <span class="email-text" id="user-email">Авторизован</span>
          </div>

          <div class="divider"></div>

          <div class="action-buttons">
            <a href="admin.html" class="btn-admin" id="admin-btn" aria-label="Перейти в админ-панель">
              <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm3.5 12.09l-1.41 1.41L12 12.41 9.91 14.5 8.5 13.09 10.59 11 8.5 8.91 9.91 7.5 12 9.59l2.09-2.09 1.41 1.41L13.41 11l2.09 2.09z"/>
              </svg>
              Админ-панель
            </a>
            <a href="brand.html" class="btn-brand" id="brand-btn" aria-label="Перейти к маркам автомобилей">
              <svg viewBox="0 0 24 24">
                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
              </svg>
              Марки авто
            </a>
            <button class="btn-logout" id="logout-btn" aria-label="Выйти из аккаунта">
              <svg viewBox="0 0 24 24">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
              </svg>
              Выйти
            </button>
          </div>
        </div>

        <!-- Info cards -->
        <div class="info-grid" aria-label="Информация о сессии">
          <div class="info-card">
            <div class="info-card-icon icon-purple">
              <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            </div>
            <div class="info-card-label">Статус</div>
            <div class="info-card-value">Авторизован</div>
          </div>

          <div class="info-card">
            <div class="info-card-icon icon-violet">
              <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10S22 17.52 22 12 17.51 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
            </div>
            <div class="info-card-label">Время входа</div>
            <div class="info-card-value" id="login-time">—</div>
          </div>

          <div class="info-card">
            <div class="info-card-icon icon-green">
              <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
            </div>
            <div class="info-card-label">Сессия</div>
            <div class="info-card-value">Активна</div>
          </div>
        </div>

      </div>
    </main>

    <footer class="page-footer">
      <p>© 2026 Личный кабинет. Все права защищены.</p>
    </footer>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

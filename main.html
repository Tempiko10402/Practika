<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная — Личный кабинет</title>
  <meta name="description" content="Личный кабинет авторизованного пользователя." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #6c63ff;
      --primary-light: #8b85ff;
      --primary-dark: #4f46e5;
      --accent: #a855f7;
      --success: #22c55e;
      --text: #f0f0f8;
      --text-muted: #a0a0b8;
      --border: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.06);
      --card-bg: rgba(15, 14, 23, 0.75);
      --shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f0e17;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animated BG ── */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(108, 99, 255, 0.16) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(168, 85, 247, 0.13) 0%, transparent 55%);
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: float 9s ease-in-out infinite;
      z-index: 0;
    }

    .orb-1 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, #6c63ff, transparent);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #a855f7, transparent);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.04); }
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% { transform: translateY(100vh); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header / Navbar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: rgba(15, 14, 23, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(108, 99, 255, 0.35);
    }

    .nav-logo-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .nav-brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    /* Status badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 100px;
      padding: 5px 12px;
      font-size: 12px;
      color: #86efac;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); transform: scale(1); }
      50% { box-shadow: 0 0 14px rgba(34, 197, 94, 0.8); transform: scale(1.15); }
    }

    /* ── Main content ── */
    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .content-inner {
      width: 100%;
      max-width: 680px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Welcome card ── */
    .welcome-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 52px 48px;
      text-align: center;
      box-shadow: var(--shadow), 0 0 0 1px rgba(108, 99, 255, 0.07);
      margin-bottom: 24px;
    }

    .welcome-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 12px 32px rgba(108, 99, 255, 0.4);
      animation: avatarFloat 4s ease-in-out infinite;
    }

    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); box-shadow: 0 12px 32px rgba(108, 99, 255, 0.4); }
      50% { transform: translateY(-6px) rotate(2deg); box-shadow: 0 18px 40px rgba(108, 99, 255, 0.5); }
    }

    .welcome-avatar svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.75) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Email pill */
    .email-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(108, 99, 255, 0.12);
      border: 1px solid rgba(108, 99, 255, 0.25);
      border-radius: 100px;
      padding: 8px 18px;
      margin-bottom: 36px;
    }

    .email-pill svg {
      width: 16px;
      height: 16px;
      fill: var(--primary-light);
    }

    .email-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-light);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 32px;
    }

    /* Action buttons container */
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Admin button */
    .btn-admin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 32px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
      text-decoration: none;
    }

    .btn-admin::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .btn-admin:hover::before { opacity: 1; }

    .btn-admin:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(108, 99, 255, 0.45);
    }

    .btn-admin:active { transform: translateY(0); }

    .btn-admin svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Logout button */
    .btn-logout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 32px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-logout::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.12);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .btn-logout:hover::before { opacity: 1; }

    .btn-logout:hover {
      border-color: rgba(239, 68, 68, 0.55);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.2);
    }

    .btn-logout:active { transform: translateY(0); }

    .btn-logout svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ── Info cards row ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .info-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      transition: all 0.25s ease;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .info-card:nth-child(1) { animation-delay: 0.1s; }
    .info-card:nth-child(2) { animation-delay: 0.2s; }
    .info-card:nth-child(3) { animation-delay: 0.3s; }

    .info-card:hover {
      border-color: rgba(108, 99, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .info-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .icon-purple { background: rgba(108, 99, 255, 0.15); }
    .icon-violet { background: rgba(168, 85, 247, 0.15); }
    .icon-green  { background: rgba(34, 197, 94, 0.15); }

    .info-card-icon svg {
      width: 22px;
      height: 22px;
    }

    .icon-purple svg { fill: var(--primary-light); }
    .icon-violet svg { fill: #c084fc; }
    .icon-green svg  { fill: #86efac; }

    .info-card-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .info-card-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Footer ── */
    .page-footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: rgba(160, 160, 184, 0.4);
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .welcome-card { padding: 36px 24px; }
      .welcome-title { font-size: 26px; }
      .info-grid { grid-template-columns: 1fr; }
      .navbar { padding: 16px 20px; }
      .nav-brand { font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="particles" id="particles-container"></div>

  <div class="page" id="page-content" style="display:none">

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="Основная навигация">
      <div class="nav-logo">
        <div class="nav-logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <span class="nav-brand">Личный кабинет</span>
      </div>
      <div class="status-badge" aria-label="Статус: онлайн">
        <span class="status-dot"></span>
        <span>Онлайн</span>
      </div>
    </nav>

    <!-- Main content -->
    <main class="content" role="main">
      <div class="content-inner">

        <!-- Welcome card -->
        <div class="welcome-card">
          <div class="welcome-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>

          <h1 class="welcome-title">Добро пожаловать!</h1>
          <p class="welcome-subtitle">Вы успешно вошли в систему. Рады видеть вас снова.</p>

          <div class="email-pill" aria-label="Статус пользователя">
            <svg viewBox="0 0 24 24">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            <span class="email-text" id="user-email">Авторизован</span>
          </div>

          <div class="divider"></div>

          <div class="action-buttons">
            <a href="admin.html" class="btn-admin" id="admin-btn" aria-label="Перейти в админ-панель">
              <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm3.5 12.09l-1.41 1.41L12 12.41 9.91 14.5 8.5 13.09 10.59 11 8.5 8.91 9.91 7.5 12 9.59l2.09-2.09 1.41 1.41L13.41 11l2.09 2.09z"/>
              </svg>
              Админ-панель
            </a>
            <button class="btn-logout" id="logout-btn" aria-label="Выйти из аккаунта">
              <svg viewBox="0 0 24 24">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
              </svg>
              Выйти
            </button>
          </div>
        </div>

        <!-- Info cards -->
        <div class="info-grid" aria-label="Информация о сессии">
          <div class="info-card">
            <div class="info-card-icon icon-purple">
              <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            </div>
            <div class="info-card-label">Статус</div>
            <div class="info-card-value">Авторизован</div>
          </div>

          <div class="info-card">
            <div class="info-card-icon icon-violet">
              <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10S22 17.52 22 12 17.51 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
            </div>
            <div class="info-card-label">Время входа</div>
            <div class="info-card-value" id="login-time">—</div>
          </div>

          <div class="info-card">
            <div class="info-card-icon icon-green">
              <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
            </div>
            <div class="info-card-label">Сессия</div>
            <div class="info-card-value">Активна</div>
          </div>
        </div>

      </div>
    </main>

    <footer class="page-footer">
      <p>© 2026 Личный кабинет. Все права защищены.</p>
    </footer>

  </div>

  <script>
    const API_BASE = ''; // Запросы идут через прокси-сервер (server.py)

    // ─── Auth guard ───────────────────────────────────────────────────────────
    async function checkAuth() {
      const accessToken = localStorage.getItem('accessToken');
      const refreshToken = localStorage.getItem('refreshToken');

      // If neither token exists, redirect immediately
      if (!accessToken && !refreshToken) {
        window.location.replace('aut.html');
        return false;
      }

      // If we have a refreshToken but no accessToken, try to refresh
      if (!accessToken && refreshToken) {
        try {
          const resp = await fetch(`${API_BASE}/api/Authorization/CheckRefresh`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refreshToken })
          });

          if (resp.ok) {
            const data = await resp.json();
            const newToken = data?.accessToken || data?.token;
            if (newToken) {
              localStorage.setItem('accessToken', newToken);
              if (data.refreshToken) localStorage.setItem('refreshToken', data.refreshToken);
              return true;
            }
          }
          // Refresh failed
          clearSession();
          window.location.replace('aut.html');
          return false;
        } catch {
          clearSession();
          window.location.replace('aut.html');
          return false;
        }
      }

      return true;
    }

    function clearSession() {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
    }

    // ─── Particles ────────────────────────────────────────────────────────────
    (function createParticles() {
      const container = document.getElementById('particles-container');
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = `
          left: ${Math.random() * 100}%;
          width: ${Math.random() * 3 + 1}px;
          height: ${Math.random() * 3 + 1}px;
          animation-duration: ${Math.random() * 14 + 8}s;
          animation-delay: ${Math.random() * 12}s;
          opacity: ${Math.random() * 0.35 + 0.05};
        `;
        container.appendChild(p);
      }
    })();

    // ─── Logout ───────────────────────────────────────────────────────────────
    document.getElementById('logout-btn').addEventListener('click', () => {
      clearSession();
      window.location.replace('aut.html');
    });

    // ─── Set login time ───────────────────────────────────────────────────────
    function setLoginTime() {
      const now = new Date();
      const formatted = now.toLocaleTimeString('ru-RU', {
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('login-time').textContent = formatted;
    }

    // ─── Очистка хранилища: остаются только токены в localStorage ────────────
    // Выполняется ДО проверки авторизации, чтобы лишние ключи не жили на странице
    (function cleanBrowserStorage() {
      const allowedKeys = ['accessToken', 'refreshToken'];

      // токены теперь в localStorage, sessionStorage можно полностью очистить
      sessionStorage.clear();

      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (!allowedKeys.includes(key)) {
          localStorage.removeItem(key);
        }
      }
    })();

    // ─── Init ─────────────────────────────────────────────────────────────────
    (async function init() {
      const isAuthed = await checkAuth();
      if (!isAuthed) return;

      // Show page after auth check passes
      document.getElementById('page-content').style.display = 'flex';

      // Display login time
      setLoginTime();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бренды — Управление марками</title>
  <meta name="description" content="Управление марками автомобилей: просмотр, создание, редактирование, изменение статуса." />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </div>
        <div class="header-title">Марки<span> Авто</span></div>
      </div>
      <div class="header-right">
        <button class="btn-home" id="btn-home">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          На главную
        </button>
        <button class="btn-logout" id="btn-logout">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          Выйти
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="main">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon purple">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM5 11l1.5-4.5h11L19 11H5z"/></svg>
          </div>
          <div class="stat-info">
            <h3 id="stat-total">—</h3>
            <p>Всего брендов</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          </div>
          <div class="stat-info">
            <h3 id="stat-active">—</h3>
            <p>Активных</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          </div>
          <div class="stat-info">
            <h3 id="stat-inactive">—</h3>
            <p>Неактивных</p>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <span class="search-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </span>
            <input type="text" id="search-input" placeholder="Поиск по названию..." />
          </div>
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all" id="filter-all">Все</button>
            <button class="filter-btn" data-filter="active" id="filter-active">Активные</button>
            <button class="filter-btn" data-filter="inactive" id="filter-inactive">Неактивные</button>
          </div>
          <button class="btn-secondary" id="btn-refresh">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            Обновить
          </button>
        </div>
        <button class="btn-primary" id="btn-create-brand">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Добавить бренд
        </button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Бренд</th>
                <th>Логотип</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="brands-tbody"></tbody>
          </table>
        </div>
        <div class="table-footer">
          <span id="table-info">Загрузка...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ═══ Create Brand Modal ═══ -->
  <div class="modal-overlay" id="modal-create">
    <div class="modal">
      <div class="modal-header">
        <h2>Новый бренд</h2>
        <button class="modal-close" id="modal-close-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="create-brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="cb-name">Название бренда *</label>
            <input class="form-input" id="cb-name" placeholder="Например: Toyota, BMW..." required />
            <span class="field-error" id="err-cb-name"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="cb-logo">Логотип (необязательно)</label>
            <div class="file-zone" id="cb-zone">
              <input type="file" id="cb-logo" accept="image/*" />
              <div class="file-zone-inner" id="cb-zone-inner">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span id="cb-file-name">Нажмите или перетащите файл</span>
                <small>PNG, JPG, SVG до 5MB</small>
              </div>
              <img id="cb-preview" class="file-preview" alt="Предпросмотр" />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-cancel-btn">Отмена</button>
        <button class="btn-submit" id="btn-submit-create">
          <span class="btn-spinner" id="create-spinner"></span>
          Создать
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ Edit Brand Modal ═══ -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <div class="modal-header">
        <h2>Редактировать бренд</h2>
        <button class="modal-close" id="modal-edit-close">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="edit-brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="eb-name">Название бренда *</label>
            <input class="form-input" id="eb-name" required />
            <span class="field-error" id="err-eb-name"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="eb-logo">Новый логотип (необязательно)</label>
            <div class="file-zone" id="eb-zone">
              <input type="file" id="eb-logo" accept="image/*" />
              <div class="file-zone-inner" id="eb-zone-inner">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span id="eb-file-name">Нажмите или перетащите файл</span>
                <small>Оставьте пустым чтобы не менять</small>
              </div>
              <img id="eb-preview" class="file-preview" alt="Предпросмотр" />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-edit-cancel">Отмена</button>
        <button class="btn-submit" id="btn-submit-edit">
          <span class="btn-spinner" id="edit-spinner"></span>
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ Change Status Modal ═══ -->
  <div class="modal-overlay" id="modal-status">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Изменить статус</h2>
        <button class="modal-close" id="modal-status-close">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="status-confirm-body">
          <p class="status-confirm-text">Бренд: <strong id="status-brand-name"></strong></p>
          <p class="status-confirm-sub" id="status-confirm-sub"></p>
          <div class="status-options">
            <label class="status-option" id="opt-active">
              <input type="radio" name="status-radio" value="true" id="radio-active" />
              <div class="status-option-inner">
                <div class="status-option-dot active-dot"></div>
                <div>
                  <div class="status-option-title">Активен</div>
                  <div class="status-option-desc">Бренд виден клиентам</div>
                </div>
              </div>
            </label>
            <label class="status-option" id="opt-inactive">
              <input type="radio" name="status-radio" value="false" id="radio-inactive" />
              <div class="status-option-inner">
                <div class="status-option-dot inactive-dot"></div>
                <div>
                  <div class="status-option-title">Неактивен</div>
                  <div class="status-option-desc">Бренд скрыт от клиентов</div>
                </div>
              </div>
            </label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-status-cancel">Отмена</button>
        <button class="btn-submit" id="btn-submit-status">
          <span class="btn-spinner" id="status-spinner"></span>
          Применить
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/brand.js"></script>
</body>
</html>
